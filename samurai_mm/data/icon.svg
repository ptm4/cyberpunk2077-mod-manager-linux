  <path d="M62 160 Q36 196 56 222 Q66 196 72 174 Z" fill="#1c1c22" stroke="#0a0a0c" stroke-width="2"/>
  <!-- right flipper: chrome cyber arm -->
  <path d="M194 160 Q222 196 200 224 Q190 196 184 174 Z" fill="url(#chrome)" stroke="#4a4e56" stroke-width="2"/>
  <path d="M190 172 Q204 184 206 196 M188 188 Q200 200 202 212" fill="none" stroke="#4a4e56" stroke-width="2"/>
  <path d="M196 178 Q204 186 205 192" fill="none" stroke="#3ad7e8" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="190" cy="168" r="4" fill="#4a4e56"/><circle cx="190" cy="168" r="1.8" fill="#3ad7e8"/>
  <!-- belt with lights and the sword's hilt -->
  <path d="M74 200 Q128 214 182 200 L182 214 Q128 228 74 214 Z" fill="#2a2a32"/>
  <path d="M74 200 Q128 214 182 200" fill="none" stroke="#e2504c" stroke-width="2"/>
  <g fill="#3ad7e8"><circle cx="104" cy="211" r="2"/><circle cx="116" cy="213.5" r="2"/><circle cx="128" cy="214.5" r="2"/><circle cx="140" cy="213.5" r="2"/><circle cx="152" cy="211" r="2"/></g>
  <g transform="rotate(-32 92 204)">
    <rect x="40" y="198" width="48" height="12" rx="4" fill="#141418" stroke="#0a0a0c" stroke-width="1.5"/>
    <path d="M46 199 l5 5 l-5 5 M57 199 l5 5 l-5 5 M68 199 l5 5 l-5 5" fill="none" stroke="#e2504c" stroke-width="2.2"/>
    <ellipse cx="90" cy="204" rx="4" ry="11" fill="url(#chrome)"/>
  </g>
  <!-- eyes: left normal; right is a cyber optic with a chrome plate -->
  <ellipse cx="108" cy="142" rx="13" ry="14" fill="#ffffff"/>
  <circle cx="111" cy="144" r="6.5" fill="#141418"/>
  <circle cx="113" cy="141" r="2.2" fill="#ffffff"/>
  <path d="M134 130 L170 128 L176 146 L164 162 L136 158 Z" fill="url(#chrome)" stroke="#4a4e56" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="152" cy="144" r="11" fill="#141418" stroke="#4a4e56" stroke-width="2"/>
  <circle cx="152" cy="144" r="7.5" fill="#ff3b36"/>
  <circle cx="152" cy="144" r="3.2" fill="#ffd2cf"/>
  <path d="M140 156 L158 156" stroke="#3ad7e8" stroke-width="2" stroke-linecap="round"/>
  <!-- beak with a chrome jaw -->
  <path d="M114 158 Q128 152 142 158 Z" fill="#f0a030"/>
  <path d="M114 158 Q128 152 142 158 L138 162 L118 162 Z" fill="#f0a030" stroke="#c97d14" stroke-width="1.2"/>
  <path d="M117 162 L139 162 Q128 172 117 162 Z" fill="url(#chrome)" stroke="#4a4e56" stroke-width="1.2"/>
  <!-- helmet: dark lacquer, red ribs, chrome crest -->
  <path d="M60 126 Q60 60 128 54 Q196 60 196 126 Z" fill="url(#armor)" stroke="#0a0a0c" stroke-width="3"/>
  <path d="M96 60 Q90 92 92 124 M128 54 L128 124 M160 60 Q166 92 164 124" fill="none" stroke="#e2504c" stroke-width="2.2" opacity="0.85"/>
  <path d="M50 124 Q128 108 206 124 L206 134 Q128 118 50 134 Z" fill="#141418" stroke="#e2504c" stroke-width="2"/>
  <path d="M50 126 L36 114 L46 136 Z M206 126 L220 114 L210 136 Z" fill="#2a2a32" stroke="#e2504c" stroke-width="2" stroke-linejoin="round"/>
  <path d="M120 70 Q92 52 74 2 Q100 34 128 56 Z" fill="url(#chrome)" stroke="#4a4e56" stroke-width="2" stroke-linejoin="round"/>
  <path d="M136 70 Q164 52 182 2 Q156 34 128 56 Z" fill="url(#chrome)" stroke="#4a4e56" stroke-width="2" stroke-linejoin="round"/>
  <path d="M84 16 Q100 40 122 60 M172 16 Q156 40 134 60" fill="none" stroke="#3ad7e8" stroke-width="1.6" opacity="0.9"/>
  <polygon points="128,70 137,75 137,85 128,90 119,85 119,75" fill="#141418" stroke="url(#chrome)" stroke-width="2.5"/>
  <circle cx="128" cy="80" r="4" fill="#ff3b36"/>
  <!-- antenna -->
  <path d="M184 92 L198 66" stroke="#9aa0aa" stroke-width="3" stroke-linecap="round"/>
  <circle cx="199" cy="64" r="4" fill="#3ad7e8"/>
</g>

  </g>
</svg>
