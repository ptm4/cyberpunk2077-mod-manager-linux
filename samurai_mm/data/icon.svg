<!-- Samurai Mod Manager mascot. Original artwork, part of this project. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="halo" cx="50%" cy="46%" r="50%">
      <stop offset="0" stop-color="#25232c"/><stop offset="1" stop-color="#0f0f13"/>
    </radialGradient>
  </defs>
  <rect width="256" height="256" rx="48" fill="#0c0c0e"/>
  <circle cx="128" cy="128" r="116" fill="url(#halo)" stroke="#e2504c" stroke-width="3"/>
  <circle cx="128" cy="128" r="108" fill="none" stroke="#3ad7e8" stroke-width="1" opacity="0.5" stroke-dasharray="6 10"/>
  <g transform="translate(128 132) scale(0.88) translate(-128 -128)">
<g id="mascot">
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f4f7"/><stop offset="0.45" stop-color="#9aa0aa"/><stop offset="0.55" stop-color="#c9ced6"/><stop offset="1" stop-color="#5d626c"/>
    </linearGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a44"/><stop offset="1" stop-color="#1a1a20"/>
    </linearGradient>
  </defs>
  <ellipse cx="128" cy="246" rx="62" ry="7" fill="#000" opacity="0.5"/>
  <!-- scabbard behind the body -->
  <path d="M150 204 L222 236" stroke="#141418" stroke-width="11" stroke-linecap="round"/>
  <path d="M156 207 L216 233" stroke="#e2504c" stroke-width="2" stroke-linecap="round"/>
  <!-- neck guard: dark lacquered plates with red trim -->
  <path d="M60 122 L30 176 Q128 196 226 176 L196 122 Z" fill="url(#armor)" stroke="#0a0a0c" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M48 140 Q128 156 208 140 M38 158 Q128 176 218 158" fill="none" stroke="#e2504c" stroke-width="2.5"/>
  <!-- feet: one normal, one chrome -->
  <ellipse cx="102" cy="238" rx="21" ry="9" fill="#f0a030"/>
  <ellipse cx="154" cy="238" rx="21" ry="9" fill="url(#chrome)" stroke="#4a4e56" stroke-width="1.5"/>
  <path d="M142 236 L166 236" stroke="#3ad7e8" stroke-width="2"/>
  <!-- body -->
  <ellipse cx="128" cy="172" rx="68" ry="70" fill="#1c1c22" stroke="#0a0a0c" stroke-width="3"/>
  <ellipse cx="128" cy="190" rx="46" ry="46" fill="#ecebe7"/>
  <!-- circuit tattoo glowing on the dark side of the body -->
  <g fill="none" stroke="#3ad7e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <polyline points="72,150 82,160 82,176 76,182"/>
    <polyline points="66,170 74,178"/>
  </g>
  <g fill="#3ad7e8"><circle cx="72" cy="150" r="2.6"/><circle cx="76" cy="182" r="2.6"/><circle cx="66" cy="170" r="2.2"/></g>
